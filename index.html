<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팀플 회의시간 맞추기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>팀플 회의시간 맞추기</h1>
      <nav class="tabs" role="tablist" aria-label="화면 선택">
        <button type="button" role="tab" id="tab-mine" aria-controls="screen-mine" aria-selected="true">내 가능시간</button>
        <button type="button" role="tab" id="tab-team" aria-controls="screen-team" aria-selected="false">팀 겹침 보기</button>
      </nav>
    </header>

    <div class="week-bar">
      <div class="week-nav">
        <button type="button" id="week-prev" aria-label="이전 주">◀ 이전 주</button>
        <span class="week-label" id="week-label"></span>
        <button type="button" id="week-next" aria-label="다음 주">다음 주 ▶</button>
      </div>
      <p class="week-today"><button type="button" id="week-today" class="link-button">이번 주로</button></p>
    </div>

    <section class="screen" id="screen-mine" role="tabpanel" aria-labelledby="tab-mine">
      <div class="screen-head">
        <h2>내 가능시간</h2>
        <button type="button" id="fixed-toggle" class="toggle" aria-pressed="false">고정 시간 편집</button>
      </div>

      <div class="fixed-banner" id="fixed-banner" hidden>
        <span>고정 시간 편집 중 · 매주 반복되는 불가 시간(수업 등)을 칠하세요. 아직 입력하지 않은 주부터 적용됩니다.</span>
        <button type="button" id="fixed-done" class="primary">완료</button>
      </div>

      <p class="hint" id="mine-hint">가능한 시간을 누르거나 드래그해서 칠하세요. 칠한 칸을 다시 누르면 지워집니다. 회색 고정 칸을 누르면 이번 주만 풀 수 있습니다.</p>

      <div class="legend" id="mine-legend">
        <span class="legend-item"><span class="swatch swatch-on"></span>가능</span>
        <span class="legend-item"><span class="swatch swatch-off"></span>불가</span>
        <span class="legend-item"><span class="swatch swatch-fixed"></span>고정 불가</span>
        <span class="legend-item"><span class="swatch swatch-released"></span>이번 주만 풂</span>
      </div>

      <p class="fixed-status" id="fixed-status" role="status" hidden></p>

      <div class="grid-wrap">
        <div class="grid" id="grid" role="grid" aria-label="요일별 가능시간 격자"></div>
      </div>

      <div class="share">
        <label class="share-name">
          <span>내 이름</span>
          <input type="text" id="my-name" maxlength="20" autocomplete="off" placeholder="팀원이 알아볼 이름">
        </label>
        <button type="button" id="copy-code" class="primary">내 코드 복사</button>
      </div>
      <p class="share-status" id="share-status" role="status" hidden></p>
      <textarea class="share-code" id="share-code" rows="3" readonly hidden aria-label="내 공유 코드"></textarea>
    </section>

    <section class="screen" id="screen-team" role="tabpanel" aria-labelledby="tab-team" hidden>
      <h2>팀 겹침 보기</h2>

      <label class="paste-label" for="paste-input">팀원 코드 붙여넣기 <small>(여러 개는 줄을 바꿔서)</small></label>
      <textarea class="paste-input" id="paste-input" rows="3" placeholder="단톡방에서 받은 코드를 붙여넣으세요"></textarea>
      <div class="paste-actions">
        <button type="button" id="paste-add" class="primary">추가</button>
      </div>
      <ul class="paste-results" id="paste-results" role="status" hidden></ul>

      <div class="members">
        <p class="members-title" id="members-title"></p>
        <ul class="members-list" id="members-list"></ul>
      </div>

      <div class="legend" id="heat-legend">
        <span class="legend-item"><span class="swatch heat-scale"></span><span id="heat-scale-label">가능 인원 적음 → 많음</span></span>
        <span class="legend-item"><span class="swatch swatch-all"></span>전원 가능</span>
      </div>

      <div class="grid-wrap">
        <div class="grid heat" id="heat-grid" role="grid" aria-label="팀 겹침 히트맵"></div>
      </div>

      <p class="heat-detail" id="heat-detail" aria-live="polite">칸을 가리키거나 누르면 가능/불가 명단이 보입니다.</p>
    </section>

    <p class="notice" id="notice" role="status" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
